<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; }
  .card { border: 1px solid #d0d5dd; border-radius: 8px; padding: 16px; }
  .state { display: inline-block; padding: 2px 10px; border-radius: 10px;
           font-size: 12px; font-weight: 600; }
  .pending { background: #fef0c7; color: #93540a; }
  .approved { background: #d1fadf; color: #05603a; }
  .refused, .expired { background: #fee4e2; color: #912018; }
  .muted { color: #667085; font-size: 12px; margin-top: 8px; }
  .stats { display: flex; gap: 12px; }
  .stat { flex: 1; text-align: center; border: 1px solid #eaecf0;
          border-radius: 8px; padding: 10px; }
  .stat .n { font-size: 22px; font-weight: 700; }
  .stat .l { font-size: 11px; color: #667085; text-transform: uppercase; }
</style>
</head>
<body>
<div class="card">
  <div class="stats">
    <div class="stat"><div class="n" id="total">—</div>
      <div class="l">Calls</div></div>
    <div class="stat"><div class="n" id="denied">—</div>
      <div class="l">Denied</div></div>
    <div class="stat"><div class="n" id="alerts">—</div>
      <div class="l">Alerts</div></div>
  </div>
  <div class="muted">MCP activity snapshot for this connection.</div>
</div>
<script>
  window.addEventListener("message", function (ev) {
    var d = (ev.data && ev.data.toolResult) || ev.data || {};
    if (d.total !== undefined) {
      document.getElementById("total").textContent = d.total;
    }
    if (d.denied !== undefined) {
      document.getElementById("denied").textContent = d.denied;
    }
    if (d.alerts !== undefined) {
      document.getElementById("alerts").textContent = d.alerts;
    }
  });
</script>
</body>
</html>
